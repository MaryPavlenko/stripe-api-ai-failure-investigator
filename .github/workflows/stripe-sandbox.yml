
name: Stripe Sandbox Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stripe-api-tests:
    name: Stripe Sandbox API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Stripe Sandbox tests
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: npm run test:sandbox
